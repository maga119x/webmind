services:
  app:
    image: ${WEBMIND_IMAGE:-webmind:0.1.0}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /data
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - webmind-data:/data
    mem_limit: 320m
    cpus: 0.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  webmind-data:
  caddy-data:
  caddy-config:
