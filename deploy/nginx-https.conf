# Managed WebMind virtual host; other sites are independent.
server {
    listen 80;
    listen [::]:80;
    server_name webmind.danho.kr;
    access_log /var/log/nginx/webmind.access.log webmind_private;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/webmind-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://webmind.danho.kr$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webmind.danho.kr;
    ssl_certificate /etc/letsencrypt/live/webmind.danho.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmind.danho.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/webmind.access.log webmind_private;
    error_log /var/log/nginx/webmind.error.log warn;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
