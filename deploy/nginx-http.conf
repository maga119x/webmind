# Managed WebMind virtual host; other sites are independent.
server {
    listen 80;
    listen [::]:80;
    server_name webmind.danho.kr;
    access_log /var/log/nginx/webmind.access.log webmind_private;
    error_log /var/log/nginx/webmind.error.log warn;
    client_max_body_size 8m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/webmind-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503 "WebMind deployment in progress. Please try again shortly.\n";
        add_header Content-Type text/plain;
    }
}
